[workspace]
members = ["crates/ludeforge-core", "apps/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ludeforge-core = { path = "crates/ludeforge-core" }
